name: Feature Request
description: Propose an improvement or new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Workflow Gap
      description: What task or workflow is currently difficult or missing?
      placeholder: When working on remote servers without X11...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should the CLI behave or what flag should be added?
      placeholder: Add a flag --json to emit machine-readable output...
    validations:
      required: true
